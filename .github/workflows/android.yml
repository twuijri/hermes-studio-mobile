name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'VERSION'
      - 'scripts/check-version.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'VERSION'
      - 'scripts/check-version.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify shared version
        run: |
          ../scripts/check-version.sh
          echo "MOBILE_VERSION=$(tr -d '[:space:]' < ../VERSION)" >> "$GITHUB_ENV"

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          # AGP wants a JKS, and the runner ships keytool, so convert in place.
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/signing.p12" -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" \
            -destkeystore "$RUNNER_TEMP/signing.jks" -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias "$KEY_ALIAS"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      # Catches a translation that dropped a key or mangled a placeholder before
      # anything is packaged. See docs/adding-a-language.md.
      - name: Run tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/hermes-studio-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-studio-android
          path: out/hermes-studio-android.apk

      - name: Publish rolling build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Hermes Studio Mobile ${{ env.MOBILE_VERSION }} — Android
          body: |
            Android APK for Hermes Studio Mobile ${{ env.MOBILE_VERSION }}, built from `main`
            (${{ github.sha }}) and signed with the project key
            so it installs over the previous version.

            Android will warn that Play Protect has not seen this developer —
            choose **Install anyway**, which is expected for any app installed
            outside the Play Store.

            Coming from a build published before 2026-07-30? Uninstall the old app
            once first: those builds were signed with a throwaway CI key.
          files: out/hermes-studio-android.apk
          prerelease: true
